backfill_hourly_statistics:
  name: Backfill hourly statistics
  description: >-
    One-time backfill of the Last Hour Usage long-term statistics using the last
    N hours of correctly-timestamped hourly data. Overwrites rows that older
    versions mislabeled (yesterday's usage stamped under today's timestamps).
  fields:
    hours:
      name: Hours
      description: Number of hours to backfill, ending now.
      required: false
      default: 24
      example: 24
      selector:
        number:
          min: 1
          max: 168
          step: 1
          unit_of_measurement: hours
          mode: box
    config_entry_id:
      name: Account
      description: >-
        Optional: limit this backfill to a single Sensus Analytics account
        (config entry). If omitted, applies to all configured accounts.
      required: false
      selector:
        config_entry:
          integration: sensus_analytics

backfill_daily_history:
  name: Backfill daily history
  description: >-
    One-time backfill of the Daily Usage long-term statistics with historical
    data: full calendar months before the cutover date (from Sensus's
    pre-aggregated monthly totals), then real daily figures from the start of
    that month through today - correcting any already-recorded days that were
    undercounted due to late settlement. Written as one continuously-increasing
    cumulative sum so it connects seamlessly with the entity's existing live
    data.
  fields:
    cutover_date:
      name: Cutover date
      description: >-
        Only controls where the monthly-aggregate backfill stops; everything
        from the start of that month through today is corrected using real
        daily figures regardless of this date.
      required: true
      example: "2026-01-01"
      selector:
        date: {}
    config_entry_id:
      name: Account
      description: >-
        Optional: limit this backfill to a single Sensus Analytics account
        (config entry). If omitted, applies to all configured accounts.
      required: false
      selector:
        config_entry:
          integration: sensus_analytics

probe_retention:
  name: Probe hourly data retention
  description: >-
    Read-only. Finds the oldest day Sensus still has hourly usage data for and
    returns it. Nothing is written.
  fields:
    config_entry_id:
      name: Account
      description: >-
        Optional: limit this action to a single Sensus Analytics account
        (config entry). If omitted, applies to all configured accounts.
      required: false
      selector:
        config_entry:
          integration: sensus_analytics

sync_statistics:
  name: Sync hourly water statistics
  description: >-
    Rewrites the hourly water-usage statistic from the start date through the
    most recent settled hour, rebuilding the running total and verifying it
    afterwards. Runs automatically for the last few days after every update;
    use this to rebuild a longer range.
  fields:
    start_date:
      name: Start date
      description: >-
        First local day to include. Days older than the oldest day Sensus
        still has hourly data for are skipped.
      required: true
      selector:
        date:
    config_entry_id:
      name: Account
      description: >-
        Optional: limit this action to a single Sensus Analytics account
        (config entry). If omitted, applies to all configured accounts.
      required: false
      selector:
        config_entry:
          integration: sensus_analytics

verify_statistics:
  name: Verify hourly water statistics
  description: >-
    Read-only. Checks that the hourly water-usage statistic has a row for every
    hour from the start date onward and that each running total equals the
    previous total plus that hour's usage. Returns the first problem found.
  fields:
    start_date:
      name: Start date
      description: >-
        First local day to include. Days older than the oldest day Sensus
        still has hourly data for are skipped.
      required: true
      selector:
        date:
    config_entry_id:
      name: Account
      description: >-
        Optional: limit this action to a single Sensus Analytics account
        (config entry). If omitted, applies to all configured accounts.
      required: false
      selector:
        config_entry:
          integration: sensus_analytics
