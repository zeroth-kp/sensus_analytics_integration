backfill_hourly_statistics:
  name: Backfill hourly statistics
  description: >-
    One-time backfill of the Last Hour Usage long-term statistics using the last
    N hours of correctly-timestamped hourly data. Overwrites rows that older
    versions mislabeled (yesterday's usage stamped under today's timestamps).
  fields:
    hours:
      name: Hours
      description: Number of hours to backfill, ending now.
      required: false
      default: 24
      example: 24
      selector:
        number:
          min: 1
          max: 168
          step: 1
          unit_of_measurement: hours
          mode: box

backfill_daily_history:
  name: Backfill daily history
  description: >-
    One-time backfill of the Daily Usage long-term statistics with historical
    data: full calendar months before the cutover date (from Sensus's
    pre-aggregated monthly totals), then real daily figures from the start of
    that month through the cutover date itself - correcting any days already
    recorded but undercounted due to late settlement. Written as one
    continuously-increasing cumulative sum so it connects seamlessly with the
    entity's existing live data.
  fields:
    cutover_date:
      name: Cutover date
      description: >-
        Existing statistics on/after this date are corrected and reconnected
        to the new cumulative sum; everything before it is backfilled from
        Sensus's historical monthly/daily data.
      required: true
      example: "2026-07-05"
      selector:
        date: {}
