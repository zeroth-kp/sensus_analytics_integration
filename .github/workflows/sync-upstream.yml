name: Upstream Review

on:
  schedule:
    - cron: '0 6 * * 1' # Weekly, Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/zestysoft/sensus_analytics_integration.git
          git fetch --no-tags upstream main

      - name: List unreviewed upstream commits
        id: list
        run: echo "count=$(.github/scripts/list-upstream-commits.sh "$RUNNER_TEMP/upstream-review.md")" >> "$GITHUB_OUTPUT"

      - name: Open or update the review issue
        if: steps.list.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          COUNT: ${{ steps.list.outputs.count }}
        run: |
          gh label create upstream-review --color 0E8A16 \
            --description "Upstream commits waiting to be triaged" 2>/dev/null || true
          title="Upstream: ${COUNT} new commit(s) to review"
          existing="$(gh issue list --label upstream-review --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --title "$title" --body-file "$RUNNER_TEMP/upstream-review.md"
          else
            gh issue create --title "$title" --label upstream-review --body-file "$RUNNER_TEMP/upstream-review.md"
          fi
